[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-survival-rl"
version = "2.0.0"
description = "Configurable Spatial-Graph RL framework for student budget, biometrics, pantry, and academic scheduling with FastAPI backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "gymnasium>=0.29.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "sb3-contrib>=2.3.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
